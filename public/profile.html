<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Taomchi — Profil</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <header class="header">
    <div class="header-left">
      <span class="page-title" data-i18n="nav_profile">Profil</span>
    </div>
    <button class="lang-toggle" id="langToggle" aria-label="Tilni almashtirish">UZ</button>
  </header>

  <main class="main">

    <!-- Foydalanuvchi kartasi -->
    <section class="profile-card">
      <div class="profile-avatar" id="profileAvatar">👤</div>
      <div>
        <p class="profile-name" id="profileName">Foydalanuvchi</p>
        <p class="profile-username" id="profileUsername"></p>
      </div>
    </section>

    <!-- Premium banner -->
    <section class="premium-banner">
      <div class="premium-banner-icon">⭐</div>
      <div>
        <p class="premium-banner-title" data-i18n="premium_title">Taomchi Premium</p>
        <p class="premium-banner-subtitle" data-i18n="premium_subtitle">Tez orada — AI, shaxsiy menyu va boshqa imkoniyatlar</p>
      </div>
    </section>

    <!-- Sozlamalar ro'yxati -->
    <section class="section">
      <h2 data-i18n="settings_title">Sozlamalar</h2>
      <div class="settings-list">
        <button class="settings-row" id="langRow">
          <span class="settings-row-icon">🌐</span>
          <span class="settings-row-label" data-i18n="language_label">Til</span>
          <span class="settings-row-value" id="langValue">Lotin</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <div class="settings-row">
          <span class="settings-row-icon">🔔</span>
          <span class="settings-row-label" data-i18n="notifications_label">Bildirishnomalar</span>
          <label class="switch">
            <input type="checkbox" id="notifToggle" checked>
            <span class="switch-slider"></span>
          </label>
        </div>
      </div>
    </section>

    <!-- Yordam -->
    <section class="section">
      <h2 data-i18n="support_title">Yordam</h2>
      <div class="settings-list">
        <a class="settings-row" href="https://t.me/yuuvsuf" target="_blank" rel="noopener">
          <span class="settings-row-icon">💬</span>
          <span class="settings-row-label" data-i18n="contact_us">Biz bilan bog'lanish</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </a>
      </div>
    </section>

    <p class="app-version" data-i18n="app_version">Taomchi v1.0</p>

  </main>

  <nav class="bottom-nav">
    <button class="nav-item" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span data-i18n="nav_home">Bosh sahifa</span>
    </button>
    <button class="nav-item" data-page="recipes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 11h.01M11 15h.01M16 16h.01M2 16l6-6a4 4 0 0 1 5 0l1 1a4 4 0 0 0 5 0l3-3"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
      <span data-i18n="nav_recipes">Retseptlar</span>
    </button>
    <button class="nav-item" data-page="favorites">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
      <span data-i18n="nav_favorites">Saqlanganlar</span>
    </button>
    <button class="nav-item active" data-page="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span data-i18n="nav_profile">Profil</span>
    </button>
  </nav>

  <script src="i18n.js"></script>
  <script src="nav.js"></script>
  <script src="profile.js"></script>
</body>
</html>
