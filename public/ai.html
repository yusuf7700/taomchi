<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ovqaty — AI'dan so'rash</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-left">
      <button class="icon-btn" id="backBtn" aria-label="Orqaga">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <span class="page-title" data-i18n="action_ai">AI'dan so'rash</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="chatHistoryBtn" aria-label="Suhbatlar tarixi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      </button>
      <button class="icon-btn" id="newChatBtn" aria-label="Yangi suhbat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="lang-toggle" id="langToggle" aria-label="Tilni almashtirish">UZ</button>
    </div>
  </header>

  <!-- ===== SUHBATLAR TARIXI PANELI ===== -->
  <div class="chat-history-overlay" id="chatHistoryOverlay">
    <div class="chat-history-panel">
      <div class="chat-history-header">
        <span data-i18n="ai_history_title">Suhbatlar tarixi</span>
        <button class="icon-btn" id="closeHistoryBtn" aria-label="Yopish">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="chat-history-list" id="chatHistoryList"></div>
    </div>
  </div>

  <!-- ===== MAIN (chat) ===== -->
  <main class="main ai-chat-main">

    <!-- Suhbat hali bo'sh bo'lganda ko'rinadigan "bosh holat" -->
    <div id="aiEmptyState" class="ai-empty-state">
      <div class="ai-hero-illustration">
        <svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="100" cy="120" rx="85" ry="16" fill="var(--cream-soft)"/>
          <ellipse cx="100" cy="85" rx="72" ry="68" fill="var(--cream-soft)" opacity="0.55"/>
          <ellipse cx="34" cy="82" rx="10" ry="18" fill="#DCEEDC" stroke="var(--green-dark)" stroke-width="2" transform="rotate(-25 34 82)"/>
          <ellipse cx="166" cy="82" rx="10" ry="18" fill="#DCEEDC" stroke="var(--green-dark)" stroke-width="2" transform="rotate(25 166 82)"/>
          <path d="M100 8 C95 -2,80 -2,80 10 C80 20,100 30,100 30 C100 30,120 20,120 10 C120 -2,105 -2,100 8 Z" fill="var(--orange)"/>
          <rect x="97" y="28" width="6" height="18" rx="3" fill="var(--green-dark)"/>
          <circle cx="100" cy="46" r="7" fill="var(--green-dark)"/>
          <path d="M32 102 A68 68 0 0 1 168 102 Z" fill="var(--green-dark)"/>
          <rect x="24" y="100" width="152" height="11" rx="5.5" fill="var(--green-dark)"/>
          <circle cx="152" cy="108" r="9" fill="var(--orange)"/>
        </svg>
      </div>
      <p class="ai-hero-title" data-i18n="ai_hero_title">Bugun oshxonada nima bor?</p>
      <p class="ai-hero-subtitle" data-i18n="ai_hero_subtitle">Qo'lingizdagi mahsulotlarni yozing, men sizga mos taomlarni topib beraman.</p>

      <div class="ai-quick-grid">
        <button class="ai-quick-card" data-prompt-key="ai_prompt_quick">
          <span class="ai-quick-icon">⚡</span>
          <span>
            <span class="ai-quick-title" data-i18n="ai_quick_title">Tez ovqat</span>
            <span class="ai-quick-desc" data-i18n="ai_quick_desc">30 daqiqalik taomlar</span>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="ai-quick-card" data-prompt-key="ai_prompt_idea">
          <span class="ai-quick-icon">✨</span>
          <span>
            <span class="ai-quick-title" data-i18n="ai_idea_title">Menga g'oya ber</span>
            <span class="ai-quick-desc" data-i18n="ai_idea_desc">Kayfiyat va vaqtga qarab tanlaymiz</span>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="ai-quick-card" data-prompt-key="ai_prompt_lowbudget">
          <span class="ai-quick-icon">💰</span>
          <span>
            <span class="ai-quick-title" data-i18n="ai_lowbudget_title">Arzon va sodda</span>
            <span class="ai-quick-desc" data-i18n="ai_lowbudget_desc">Kam mahsulot bilan</span>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="ai-quick-card" data-prompt-key="ai_prompt_guest">
          <span class="ai-quick-icon">🎉</span>
          <span>
            <span class="ai-quick-title" data-i18n="ai_guest_title">Mehmon kutaman</span>
            <span class="ai-quick-desc" data-i18n="ai_guest_desc">Bayram uchun taklif</span>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>

      <p class="ai-popular-label" data-i18n="ai_popular_label">Mashhur so'rovlar</p>
      <div class="ai-popular-chips">
        <button class="ai-popular-chip" data-prompt-key="ai_prompt_egg" data-i18n="ai_chip_egg">Tuxum bilan</button>
        <button class="ai-popular-chip" data-prompt-key="ai_prompt_potato" data-i18n="ai_chip_potato">Kartoshka bilan</button>
        <button class="ai-popular-chip" data-prompt-key="ai_prompt_veg" data-i18n="ai_chip_veg">Go'shtsiz</button>
      </div>
    </div>

    <div class="ai-chat-messages" id="aiChatMessages"></div>
  </main>

  <!-- ===== INPUT BAR ===== -->
  <div class="ai-input-bar">
    <p class="ai-quota-text" id="aiQuotaText"></p>
    <div class="ai-input-row">
      <textarea id="aiQuestionInput" class="ai-question-input" rows="1" placeholder="Masalan: Tuxum va pomidor bilan nima pishirsam bo'ladi?" data-i18n-placeholder="ai_placeholder"></textarea>
      <button id="aiAskBtn" class="ai-send-btn" aria-label="Yuborish">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      </button>
    </div>
  </div>

  <!-- ===== BOTTOM NAV ===== -->
  <nav class="bottom-nav">
    <button class="nav-item" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span data-i18n="nav_home">Bosh sahifa</span>
    </button>
    <button class="nav-item" data-page="recipes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 11h.01M11 15h.01M16 16h.01M2 16l6-6a4 4 0 0 1 5 0l1 1a4 4 0 0 0 5 0l3-3"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
      <span data-i18n="nav_recipes">Retseptlar</span>
    </button>
    <button class="nav-item" data-page="favorites">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
      <span data-i18n="nav_favorites">Saqlanganlar</span>
    </button>
    <button class="nav-item" data-page="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span data-i18n="nav_profile">Profil</span>
    </button>
  </nav>

  <script src="i18n.js"></script>
  <script src="translit.js"></script>
  <script src="nav.js"></script>
  <script src="ai.js"></script>
</body>
</html>
