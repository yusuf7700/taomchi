<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Taomchi — Retseptlar</title>
<link rel="stylesheet" href="style.css">
<!-- VAQTINCHA: xatolarni ko'rish uchun -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-left">
      <button class="icon-btn" id="backBtn" aria-label="Orqaga">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <span class="page-title" data-i18n="nav_recipes">Retseptlar</span>
    </div>
    <button class="lang-toggle" id="langToggle" aria-label="Tilni almashtirish">UZ</button>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="main">

    <!-- Qidiruv -->
    <div class="search-box search-box--light">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" data-i18n-placeholder="search_placeholder" placeholder="Taom yoki mahsulot qidiring...">
    </div>

    <!-- Kategoriya filtrlar -->
    <div class="filter-row" id="filterRow">
      <button class="filter-chip active" data-cat="all" data-i18n="filter_all">Hammasi</button>
      <button class="filter-chip" data-cat="main" data-i18n="cat_main">Asosiy taomlar</button>
      <button class="filter-chip" data-cat="soup" data-i18n="cat_soup">Sho'rvalar</button>
      <button class="filter-chip" data-cat="salad" data-i18n="cat_salad">Salatlar</button>
      <button class="filter-chip" data-cat="breakfast" data-i18n="cat_breakfast">Nonushta</button>
      <button class="filter-chip" data-cat="dessert" data-i18n="cat_dessert">Shirinliklar</button>
      <button class="filter-chip" data-cat="pastry" data-i18n="cat_pastry">Yeguliklar</button>
      <button class="filter-chip" data-cat="drinks" data-i18n="cat_drinks">Ichimliklar</button>
    </div>

    <!-- Retseptlar ro'yxati -->
    <section class="section recipe-list" id="recipeList">
      <p class="loading-text" data-i18n="loading">Yuklanmoqda...</p>
    </section>

  </main>

  <!-- ===== BOTTOM NAV ===== -->
  <nav class="bottom-nav">
    <button class="nav-item" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span data-i18n="nav_home">Bosh sahifa</span>
    </button>
    <button class="nav-item active" data-page="recipes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 11h.01M11 15h.01M16 16h.01M2 16l6-6a4 4 0 0 1 5 0l1 1a4 4 0 0 0 5 0l3-3"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
      <span data-i18n="nav_recipes">Retseptlar</span>
    </button>
    <button class="nav-item" data-page="favorites">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
      <span data-i18n="nav_favorites">Saqlanganlar</span>
    </button>
    <button class="nav-item" data-page="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span data-i18n="nav_profile">Profil</span>
    </button>
  </nav>

  <script src="firebase-config.js"></script>
  <script src="i18n.js"></script>
  <script src="translit.js"></script>
  <script src="favorites-store.js"></script>
  <script src="recipes-cache.js"></script>
  <script src="nav.js"></script>
  <script src="recipes.js"></script>
</body>
</html>
